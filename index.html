<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>Crypto and Forex Trading</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📊</text></svg>">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <span class="logo">SC</span>
        <span class="app-title">Crypto and Forex Trading</span>
      </div>
      <div class="header-right">
        <div id="signal-badge" class="badge badge-long">Lệnh Chờ Long</div>
        <select id="symbol-select">
          <option value="BTCUSDT">BTC/USDT</option>
          <option value="ETHUSDT">ETH/USDT</option>
          <option value="XAUUSD">XAU/USD</option>
        </select>
      </div>
    </header>

    <div id="bias-bar">
      <span id="long-pct" class="pct-label long-label">50%</span>
      <div class="bar-track">
        <div id="long-fill" class="bar-fill long-fill"></div>
        <div id="short-fill" class="bar-fill short-fill"></div>
      </div>
      <span id="short-pct" class="pct-label short-label">50%</span>
    </div>

    <div id="tf-row"></div>

    <div id="marquee">
      <div id="marquee-content">
        <span id="marquee-text">Đang tải dữ liệu...</span>
      </div>
    </div>

    <div id="chart-area">
      <div id="chart-container"></div>
      <div id="price-overlay">
        <div id="current-price-tag"></div>
      </div>
    </div>

    <div id="tabs">
      <button class="tab active" data-tab="signal">
        <span class="tab-dot dot-live"></span>Tín hiệu Live
      </button>
      <button class="tab" data-tab="analysis">
        <span class="tab-dot dot-analysis"></span>Phân tích thị trường
      </button>
      <button class="tab" data-tab="trendlines">
        <span class="tab-dot dot-trendline"></span>Đường xu hướng (<span id="tl-count">0</span>)
      </button>
    </div>

    <div id="tab-content">
      <div id="panel-signal" class="panel active">
        <div id="signal-steps"></div>
        <div id="confidence-bar">
          <span>Độ tin cậy tổng hợp</span>
          <span id="confidence-value">0%</span>
        </div>
      </div>

      <div id="panel-analysis" class="panel">
        <div id="analysis-content">
          <div id="news-filters"></div>
          <div id="news-list"></div>
        </div>
      </div>

      <div id="panel-trendlines" class="panel">
        <div id="trendline-list"></div>
      </div>
    </div>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu thị trường...</p>
    </div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
